apiVersion: apps/v1
kind: Deployment
metadata:
  name: employees-deploy
  namespace: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employees
  template:
    metadata:
      labels:
        app: employees
    spec:
      containers:
      - name: employees
        image: 166147787843.dkr.ecr.us-east-1.amazonaws.com/web-application-repo:mywebapp
        ports:
        - containerPort: 8080
        env:
        - name: DBHOST
          value: "mysql.mysql.svc.cluster.local"
        - name: DBPORT
          value: "3306"
        - name: DBUSER
          value: "root"
        - name: DBPWD
          value: "Seneca@123"
        - name: APP_COLOR
          value: "pink"