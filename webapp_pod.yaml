apiVersion: v1
kind: Pod
metadata:
  name: employees
  namespace: webapp
  labels:
    app: employees
spec:
  containers:
  - name: employees
    image: 166147787843.dkr.ecr.us-east-1.amazonaws.com/web-application-repo:mywebapp
    ports:
    - containerPort: 8080
    env:
    - name: DBHOST
      value: "mysql.mysql.svc.cluster.local"
    - name: DBPORT
      value: "3306"
    - name: DBUSER
      value: "root"
    - name: DBPWD
      value: "Seneca@123"
    - name: APP_COLOR
      value: "blue"
  imagePullSecrets:  
  - name: ecr-secret